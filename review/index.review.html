<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>스튜디오 로그</title>
<link id="app-icon" rel="icon" type="image/png" href="data:image/png;base64,REMOVED_FOR_REVIEW">
<link id="touch-icon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 랙 장비처럼 얇은 패널을 쌓고, 숫자(타이머·BPM·D-Day)만 모노 판독창으로 크게 보여 준다. 단일 다크 테마. */
  color-scheme:dark;
  --bg:#121117; --surface:#1b1a22; --raised:#25232e; --line:#34313f;
  --ink:#edebf3; --ink-2:#aaa6b9; --ink-3:#7c788f;
  --prod:#8a7df0; --prod-ink:#b9b1fa; --prod-wash:rgba(138,125,240,.15);
  --piano:#c08a1e; --piano-ink:#e9bf6c; --piano-wash:rgba(210,158,56,.15);
  --job:#22a67c; --job-ink:#74d6b4; --job-wash:rgba(34,166,124,.17);
  --etc:#8d8a9c; --etc-ink:#c6c3d2; --etc-wash:rgba(141,138,156,.2);
  --ok:#5fbf8f; --alert:#ec8a6f;
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; --tab-h:60px;
  --pt:11pt; /* 일정 항목 글자 크기 (설정에서 바꿈) */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:rgba(18,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1160px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:20px}
.brand{font:600 18px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand img{width:32px;height:32px;border-radius:8px;flex:none}
.brand i{display:flex;gap:3px}
.brand i b{width:4px;height:16px;border-radius:2px;background:var(--prod)}
.brand i b+b{background:var(--piano);height:11px;align-self:flex-end}
.nav{display:flex;gap:2px;flex:1}
.nav a{color:var(--ink-2);text-decoration:none;padding:8px 13px;border-radius:8px;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--raised)}
.top-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill-timer{display:none;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:var(--piano-wash);color:var(--piano-ink);font-size:12px}
.pill-timer.on{display:flex}
.pill-timer::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--piano-ink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

main{max-width:1160px;margin:0 auto;padding:24px 20px 56px}
.tabs{display:none}

/* 공통 */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.vh h1{font:600 26px/1.25 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.vh p{color:var(--ink-2);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h2{font:600 15px/1.3 var(--f-body);letter-spacing:0}
.ph .count{color:var(--ink-3);font-weight:400;margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.primary{background:var(--ink);color:#16151c;border-color:var(--ink)}
.btn.prod{background:var(--prod);border-color:var(--prod);color:#12101f}
.btn.piano{background:var(--piano);border-color:var(--piano);color:#1c1403}
.btn.ghost{background:none}
.btn.danger{color:var(--alert);background:none}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;line-height:1.6;background:var(--raised);color:var(--ink-2);white-space:nowrap}
.chip.prod{background:var(--prod-wash);color:var(--prod-ink)}
.chip.piano{background:var(--piano-wash);color:var(--piano-ink)}
.empty{color:var(--ink-3);padding:14px 4px;font-size:14px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);font-size:14px;margin-bottom:16px}
.notice.bad{border-color:var(--alert);color:var(--alert)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* 일정 행 */
.tasks{display:grid;gap:6px}
.task{display:flex;align-items:stretch;gap:0;background:var(--raised);border-radius:8px;overflow:hidden;border-left:3px solid var(--prod)}
.task.piano{border-left-color:var(--piano)}
.task.dl{border-left-style:dashed}
.st{display:flex;align-items:center;gap:6px;padding:0 10px 0 11px;min-width:86px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
.st:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.st-doing{color:var(--ink)}
.st-done{color:var(--ok)}
.task-main{flex:1;min-width:0;padding:9px 12px;display:grid;gap:1px}
.task-main:hover{background:rgba(255,255,255,.04)}
.task-title{font-weight:500;overflow-wrap:anywhere;font-size:var(--pt)}
.task.done .task-title{color:var(--ink-3);text-decoration:line-through}
.task-meta{font-size:calc(var(--pt)*.8);color:var(--ink-3)}
.task-meta .late{color:var(--alert)}

/* 주간 스트립 */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.strip button{background:var(--wdw,var(--surface));border:1px solid var(--line);border-radius:8px;padding:8px 4px 9px;display:grid;justify-items:center;gap:3px;min-width:0}
.strip button:hover{border-color:var(--ink-3)}
.strip .wd{font-size:11px;color:var(--wd,var(--ink-3))}
.strip .dn{font:600 15px/1 var(--f-mono)}
.strip .is-today{border-color:var(--ink);background:var(--raised)}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--prod)}
.dot.piano{background:var(--piano)}
.dot.dl{border-radius:1px;transform:rotate(45deg);background:var(--alert)}

/* 달력 */
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{padding:5px 12px;border-radius:6px;color:var(--ink-2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.seg [aria-pressed="true"],.seg input:checked+span{background:var(--ink);color:#16151c}
.seg label{padding:0}
.seg label span{display:block;padding:5px 12px;border-radius:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .ttl{font:600 15px/1 var(--f-mono);min-width:104px;text-align:center}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--raised)}
.iconbtn:hover{border-color:var(--ink-3)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.month .wdh{background:var(--wdw,var(--surface));text-align:center;font-size:12px;color:var(--wd,var(--ink-3));padding:6px 0}
.cell{background:var(--wdw,var(--surface));min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:0}
.cell:hover{background:#201f28}
.cell.out .num{color:var(--ink-3);opacity:.55}
.cell .num{font:400 12px/1.5 var(--f-mono);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--wd,inherit)}
.cell.is-today .num{background:var(--ink);color:#16151c;font-weight:600}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink-2)}
.ev{display:block;font-style:normal;font-size:calc(var(--pt)*.75);line-height:1.5;padding:0 5px;border-radius:3px;background:var(--prod-wash);color:var(--prod-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.piano{background:var(--piano-wash);color:var(--piano-ink)}
.ev.dl{background:none;color:var(--alert);border:1px dashed currentColor;line-height:1.35}
.ev.done{opacity:.5;text-decoration:line-through}
.more{font-size:11px;color:var(--ink-3);padding-left:5px}
.mini .cell{min-height:0;aspect-ratio:1;align-items:center;justify-content:center;padding:2px;gap:2px}
.mini .ev,.mini .more{display:none}
.month.mini .cell .dots{display:flex}
.cell .dots{display:none}
.month.mini .cell .dots{display:flex}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--wdw,var(--surface));box-shadow:inset 0 3px 0 var(--wd,transparent);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px}
.wcol.is-today{border-color:var(--ink-2)}
.wcol h3{font:500 12px/1.4 var(--f-body);color:var(--wd,var(--ink-2));display:flex;justify-content:space-between;align-items:center}
.wcol h3 b{font:600 14px/1 var(--f-mono);color:var(--wd,var(--ink))}
.wi{display:block;width:100%;font-size:calc(var(--pt)*.8);line-height:1.4;padding:5px 7px;border-radius:5px;background:var(--prod-wash);color:var(--prod-ink);overflow-wrap:anywhere}
.wi.piano{background:var(--piano-wash);color:var(--piano-ink)}
.wi.dl{background:none;border:1px dashed var(--alert);color:var(--alert)}
.wi.done{opacity:.5;text-decoration:line-through}
.wadd{margin-top:auto;color:var(--ink-3);font-size:12px;padding:4px;border-radius:5px;text-align:center}
.wadd:hover{color:var(--ink);background:var(--raised)}

/* 프로젝트 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card-h h3{font:600 17px/1.35 var(--f-display);overflow-wrap:anywhere}
.card-h .sub{color:var(--ink-3);font-size:13px}
.readout{font:600 15px/1 var(--f-mono);padding:7px 9px;border-radius:6px;background:#0c0b10;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.readout.prod{color:var(--prod-ink)} .readout.piano{color:var(--piano-ink)} .readout.late{color:var(--alert)} .readout.fin{color:var(--ok)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.fader{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.fader output{font:600 14px/1 var(--f-mono);min-width:44px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;--v:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--prod) var(--v),#0c0b10 var(--v));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#0c0b10;border:1px solid var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--prod)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;border-radius:3px;background:var(--ink);margin-top:-10px;border:0;box-shadow:inset 0 0 0 1px #16151c,inset 0 11px 0 -9px #16151c}
input[type=range]::-moz-range-thumb{width:14px;height:24px;border-radius:3px;background:var(--ink);border:0}
.note{color:var(--ink-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.card-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.card-f .meta{color:var(--ink-3);font-size:13px}

/* 메트로놈 */
.metronome{margin-top:16px;border-color:#4a3c1c}
.metro-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.metro-controls .f{width:110px}
.metro-controls .metro-accent{display:flex;align-items:center;gap:8px;min-height:44px}
.metro-controls input[type=checkbox]{width:20px;height:20px;accent-color:var(--piano)}
.metro-beats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;min-height:16px}
.metro-dot{width:16px;height:16px;border-radius:50%;background:var(--raised);border:1px solid var(--piano)}
.metro-dot.on{background:var(--piano-ink);box-shadow:0 0 0 3px var(--piano-wash)}
.repeat-options{display:grid;gap:10px}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr) auto minmax(0,1fr);gap:8px;align-items:center}
.tp i{width:1px;height:24px;background:var(--line)}
.tp b{color:var(--ink-2);font:600 16px/1 var(--f-mono)}
.repeat-options[hidden],.repeat-days[hidden]{display:none}
.repeat-days .checks span{min-width:40px;text-align:center}
.forever{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.forever input{width:18px;height:18px;accent-color:var(--prod)}
.f input[disabled]{opacity:.45}
/* 색상 선택 · 표시 설정 */
.swr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{--c:var(--raised);position:relative;display:inline-grid;place-items:center;width:26px;height:26px;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);flex:none;cursor:pointer}
.swatch[aria-pressed="true"],.swatch.on{outline:2px solid var(--ink);outline-offset:2px}
.swatch.none{width:auto;padding:0 10px;border-radius:99px;font-size:12px;color:var(--ink-2)}
.swatch.none[aria-pressed="true"]{outline:0;background:var(--ink);color:#16151c;font-weight:600}
.swatch.custom{background:conic-gradient(#ef6b6b,#e5c24a,#5fbf8f,#38bdc8,#5b9cf5,#e879b9,#ef6b6b);overflow:hidden}
.swatch.custom.has{background:var(--c)}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
.wdrow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.wdrow:last-of-type{border-bottom:0}
.wdrow b{font:600 15px/1 var(--f-body);color:var(--wd,var(--ink-2))}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.pt-row output{font:600 14px/1 var(--f-mono);min-width:50px;text-align:right}
.pt-sample{padding:10px 12px;background:var(--raised);border-left:3px solid var(--prod);border-radius:8px;font-size:var(--pt);font-weight:500;overflow-wrap:anywhere}
.top-tools .iconbtn{width:32px;height:32px}
/* 피아노 */
.timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border-color:#4a3c1c;background:linear-gradient(180deg,#1f1c1a,#1b1a22)}
.t-read{font:600 clamp(44px,9vw,76px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--piano-ink)}
.t-read.rest{color:var(--ink-2)}
.t-sub{color:var(--ink-2);margin-top:8px;font-size:14px}
.t-side{display:grid;gap:10px;justify-items:start;min-width:250px}
.t-btns{display:flex;gap:8px;flex-wrap:wrap}
.t-set{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.t-set input{width:58px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:#0f0e14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;max-width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ink-2);outline:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.tempo{display:grid;gap:6px}
.tempo-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tempo-top .now{font:600 22px/1 var(--f-mono);color:var(--piano-ink)}
.tempo-top .now small{font:400 12px/1 var(--f-body);color:var(--ink-3);margin-left:4px}
.tempo-top .goal{font-size:13px;color:var(--ink-2)}
.meter{position:relative;height:14px;border-radius:3px;background:#0c0b10;border:1px solid var(--line);background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--piano);border-radius:2px 4px 4px 2px}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);right:0}
.step{display:flex;gap:6px;align-items:center}
.step .iconbtn{width:32px;height:32px;font:600 15px/1 var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.logs{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.log{display:grid;gap:2px;font-size:14px}
.log .lh{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.log .lh button{margin-left:auto;color:var(--ink-3);font-size:12px;padding:2px 6px;border-radius:4px}
.log .lh button:hover{color:var(--alert)}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.tile .k{font-size:13px;color:var(--ink-2)}
.tile .v{font:600 24px/1.1 var(--f-mono);letter-spacing:-.03em}
.tile .s{font-size:12px;color:var(--ink-3)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 11px var(--f-mono);fill:var(--ink-3)}
.chart .val{fill:var(--ink)}
.chart .col:hover .hit,.chart .col.on .hit{fill:rgba(255,255,255,.05)}
.tip{position:absolute;pointer-events:none;background:#0c0b10;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;white-space:nowrap;z-index:3;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tip b{font-weight:600;display:block}
.tip span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:9px;height:9px;border-radius:2px;background:var(--prod);flex:none}
.sw.piano{background:var(--piano)}
.sw.job{background:var(--job)} .sw.etc{background:var(--etc)}
.task.job{border-left-color:var(--job)} .task.etc{border-left-color:var(--etc)}
.dot.job{background:var(--job)} .dot.etc{background:var(--etc)}
.chip.job,.ev.job,.wi.job{background:var(--job-wash);color:var(--job-ink)}
.chip.etc,.ev.etc,.wi.etc{background:var(--etc-wash);color:var(--etc-ink)}
.legend{flex-wrap:wrap;row-gap:4px}
.ph{flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{color:var(--ink-3);cursor:pointer;width:max-content}
.tblwrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink-3);font-weight:500}
.hbars{display:grid;gap:12px}
.hbar{display:grid;gap:5px}
.hbar .hl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hbar .hl span:last-child{font:400 12px/1.8 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.hbar .track{height:8px;border-radius:4px;background:#0c0b10;border:1px solid var(--line);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--prod);border-radius:0 4px 4px 0}
.hbar.piano .track i{background:var(--piano)}

/* 시트 */
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
#sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(6,6,9,.66)}
.sheet{position:relative;width:min(480px,100%);max-height:min(88vh,100%);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.6}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font:600 19px/1.3 var(--f-display)}
.f{display:grid;gap:5px}
.f>span,.f>legend{font-size:13px;color:var(--ink-2);padding:0}
fieldset.f{border:0;margin:0;padding:0;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{cursor:pointer}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks span{display:block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.checks input:checked+span{background:var(--prod-wash);border-color:var(--prod);color:var(--prod-ink)}
.checks input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.sheet-foot .sp{flex:1}
.err{color:var(--alert);font-size:13px;min-height:0}
.help{font-size:13px;color:var(--ink-3)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#16151c;padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-weight:500;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
#toast[hidden]{display:none}
#toast button{font-weight:600;text-decoration:underline;white-space:nowrap}

@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:minmax(0,1fr)}
  .wcol{min-height:0}
}
@media (max-width:768px){
  .nav{display:none}
  .top-in{height:50px;padding:0 16px}
  main{padding:18px 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))}
  .vh h1{font-size:22px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,21,28,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs a{height:var(--tab-h);display:grid;place-content:center;justify-items:center;gap:3px;color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:500;-webkit-tap-highlight-color:transparent}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--ink)}
  .tabs a[aria-current="page"][href="#studio"]{color:var(--prod-ink)}
  .tabs a[aria-current="page"][href="#piano"]{color:var(--piano-ink)}
  .cell{min-height:54px;align-items:center;padding:5px 2px}
  .cell .ev,.cell .more{display:none}
  .cell .dots{display:flex}
  .timer{grid-template-columns:minmax(0,1fr)}
  .t-side{min-width:0;justify-items:stretch}
  .cards{grid-template-columns:minmax(0,1fr)}
  #sheet{place-items:end center;padding:0}
  .sheet{width:100%;max-height:92%;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom))}
  .st{min-width:78px}
  .btn,.iconbtn{min-height:40px}
  .top-tools .iconbtn{min-height:32px}
  .swr{gap:6px}
  .swatch{width:24px;height:24px}
  .swatch.none{width:auto}
  .wdrow{grid-template-columns:20px minmax(0,1fr);gap:8px}
  .wdrow .swr{gap:5px}
  .wdrow .swatch{width:21px;height:21px}
  .wdrow .swatch.none{width:auto;padding:0 8px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
/* ---------- 도우미 ---------- */

function timePick(name,label,val){
  var ok=/^\d{2}:\d{2}$/.test(val||''),H=ok?+val.slice(0,2):-1,M=ok?val.slice(3):'00',ap=H>=12?'pm':'am',h12=H<0?'':String(H%12||12),mins=[],i;
  for(i=0;i<60;i+=5)mins.push(pad(i));
  if(mins.indexOf(M)<0){mins.push(M);mins.sort()}
  var hs='<option value="">시간 없음</option>';for(i=1;i<=12;i++)hs+='<option value="'+i+'"'+(String(i)===h12?' selected':'')+'>'+pad(i)+'시</option>';
  return '<div class="f"><span>'+label+'</span><div class="tp">'+
    '<select id="tp-'+name+'-ap" data-tp="'+name+'" aria-label="'+label+' 오전 오후"><option value="am"'+(ap==='am'?' selected':'')+'>오전</option><option value="pm"'+(ap==='pm'||H<0?' selected':'')+'>오후</option></select>'+
    '<i aria-hidden="true"></i><select id="tp-'+name+'-h" data-tp="'+name+'" aria-label="'+label+' 시">'+hs+'</select>'+
    '<b aria-hidden="true">:</b><select id="tp-'+name+'-m" data-tp="'+name+'" aria-label="'+label+' 분">'+mins.map(function(m){return '<option value="'+m+'"'+(m===M?' selected':'')+'>'+m+'분</option>'}).join('')+'</select>'+
    '<input type="hidden" id="tp-'+name+'" name="'+name+'" value="'+(ok?val:'')+'"></div></div>';
}
function tpSync(name){
  var h=$('#tp-'+name+'-h').value,out=$('#tp-'+name);
  if(!h){out.value='';return}
  out.value=pad((+h%12)+($('#tp-'+name+'-ap').value==='pm'?12:0))+':'+$('#tp-'+name+'-m').value;
}
function timeText(t){return t.time?t.time+(t.timeEnd?'–'+t.timeEnd:''):''}
var WD=['일','월','화','수','목','금','토'];
var VIEWS=[['today','오늘'],['calendar','캘린더'],['studio','작업실'],['piano','피아노'],['stats','통계']];
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var uidN=0;
function uid(){return Date.now().toString(36)+(uidN++).toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function weekStart(s){return addD(s,-((pd(s).getDay()+6)%7))}

function diffD(a,b){return Math.round((pd(a)-pd(b))/864e5)}
function dday(due){var n=diffD(due,today());return n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)}
function fmtDur(sec){var m=Math.round(sec/60);if(m<60)return m+'분';var h=Math.floor(m/60);return m%60?h+'시간 '+(m%60)+'분':h+'시간'}
function clock(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?pad(h)+':':'')+pad(m)+':'+pad(s%60)}
function isDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}
/* 색상 */
var PALETTE=[['#ef6b6b','빨강'],['#f2994a','주황'],['#e5c24a','노랑'],['#5fbf8f','초록'],['#38bdc8','청록'],['#5b9cf5','파랑'],['#a78bfa','보라'],['#e879b9','분홍']];
function isHex(c){return typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)}
function rgbOf(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function wash(c,a){var r=rgbOf(c);return 'rgba('+r[0]+','+r[1]+','+r[2]+','+a+')'}
function lift(c,p){return '#'+rgbOf(c).map(function(v){return ('0'+Math.round(v+(255-v)*p).toString(16)).slice(-2)}).join('')}
/* 일정 하나에 지정한 색: 달력 칩·주간 항목·목록 줄에 입힌다 */
function chipStyle(t){return isHex(t.color)?' style="background:'+wash(t.color,.22)+';color:'+lift(t.color,.5)+'"':''}
function rowStyle(t){return isHex(t.color)?' style="border-left-color:'+t.color+'"':''}
/* 요일별 색: 0=일 … 6=토 */
function wdColor(i){var a=S&&S.settings&&S.settings.wdColors;return a&&isHex(a[i])?a[i]:''}
function wdStyle(i){var c=wdColor(i);return c?' style="--wd:'+lift(c,.2)+';--wdw:'+wash(c,.13)+'"':''}
/* 색 고르기 (팔레트 + 직접 고르기). group: 'color'(일정 폼) 또는 'wd0'~'wd6'(요일 설정) */
function swatchRow(group,val,noneLabel){
  var has=isHex(val),pal=PALETTE.some(function(p){return p[0]===val}),cust=has&&!pal;
  return '<div class="swr" role="group" data-swgroup="'+group+'" aria-label="색상">'+
    '<button type="button" class="swatch none" data-act="pick-color" data-group="'+group+'" data-color="" aria-pressed="'+(!has)+'">'+noneLabel+'</button>'+
    PALETTE.map(function(p){return '<button type="button" class="swatch" style="--c:'+p[0]+'" data-act="pick-color" data-group="'+group+'" data-color="'+p[0]+'" aria-pressed="'+(val===p[0])+'" aria-label="'+p[1]+'" title="'+p[1]+'"></button>'}).join('')+
    '<label class="swatch custom'+(cust?' has on':'')+'" title="직접 고르기"'+(cust?' style="--c:'+val+'"':'')+'><input type="color" value="'+(has?val:'#8a7df0')+'" data-change="color-custom" data-group="'+group+'" aria-label="색 직접 고르기"></label>'+
  '</div>';
}
function swatchMark(group,color){
  var g=document.querySelector('[data-swgroup="'+group+'"]');if(!g)return;
  var pal=false;
  g.querySelectorAll('button.swatch').forEach(function(b){var on=b.dataset.color===color;if(on)pal=true;b.setAttribute('aria-pressed',on?'true':'false')});
  var cu=g.querySelector('.swatch.custom');
  if(cu){var on=!!color&&!pal;cu.classList.toggle('on',on);cu.classList.toggle('has',on);if(on)cu.style.setProperty('--c',color);else cu.style.removeProperty('--c')}

function setColor(group,color){
  if(color&&!isHex(color))return;
  if(group==='color'){var h=$('#f-color');if(h)h.value=color}
  else if(/^wd[0-6]$/.test(group)){
    var i=+group.slice(2);S.settings.wdColors[i]=color;save();render();
    var lb=document.querySelector('.wdrow[data-wd="'+i+'"] b');if(lb){if(color)lb.style.setProperty('--wd',lift(color,.2));else lb.style.removeProperty('--wd')}
  }else return;
  swatchMark(group,color);

/* ---------- 표시 설정 (글자 크기는 이 기기에만 저장) ---------- */
var UIKEY='studio-log-ui',PT_DEF=11,PT_MIN=8,PT_MAX=24;
var uiPref=(function(){try{var o=JSON.parse(localStorage.getItem(UIKEY));return o&&typeof o==='object'?o:{}}catch(e){return{}}})();

function setPt(n,persist){
  n=Math.max(PT_MIN,Math.min(PT_MAX,Math.round(n)||PT_DEF));uiPref.pt=n;applyPt();
  if(persist){try{localStorage.setItem(UIKEY,JSON.stringify(uiPref))}catch(e){}}

}

    '<fieldset class="f"><legend>일정 글자 크기</legend><div class="pt-row"><input type="range" id="f-pt" min="'+PT_MIN+'" max="'+PT_MAX+'" step="1" value="'+pt+'" style="--v:'+ptFill(pt)+'" data-pt aria-label="일정 글자 크기 (pt)"><output id="out-pt" for="f-pt">'+pt+'pt</output></div>'+
    '<p class="pt-sample">새벽 세 시 2절 스트링 편곡</p>'+

    '<p class="help">오늘·캘린더·작업실의 일정 글자에 적용됩니다. 이 기기에만 저장됩니다.</p></fieldset>'+
    '<fieldset class="f"><legend>요일별 색상</legend>'+WD_ORDER.map(function(d){var c=wdColor(d);
      return '<div class="wdrow" data-wd="'+d+'"><b'+(c?' style="--wd:'+lift(c,.2)+'"':'')+'>'+WD[d]+'</b>'+swatchRow('wd'+d,c,'없음')+'</div>'}).join('')+
    '<p class="help">캘린더의 요일 칸·날짜 숫자와 오늘 화면의 이번 주 줄에 색이 입혀집니다. 일정 하나하나의 색은 일정을 만들거나 고칠 때 정합니다.</p></fieldset>'+
    '<div class="sheet-foot"><span class="sp"></span><button class="btn primary">닫기</button></div>',
    function(){closeSheet()});
}
var IC={
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',

  piano:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14M7.5 5v8h3V5M13.5 5v8h3V5"/>',

};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}

/* ---------- 상태 ---------- */
var storageOK=true, S, ui={view:'today',calMode:'month',calCursor:today(),calSel:today(),filter:'all',openLogs:{}}, undoSnap=null, dl=null;
function blank(){return{v:1,tasks:[],projects:[],pieces:[],series:[],settings:{focus:25,rest:5,wdColors:['','','','','','','']},timer:null}}
function normalize(o){
  var b=blank();
  if(!o||typeof o!=='object')return b;
  ['tasks','projects','pieces'].forEach(function(k){if(Array.isArray(o[k]))b[k]=o[k].filter(function(x){return x&&typeof x==='object'})});
  b.tasks.forEach(function(t){t.id=t.id||uid();if(!CAT[t.cat])t.cat='prod';if(!STATUS[t.status])t.status='todo';if(!isDate(t.date))t.date=today();t.title=String(t.title||'제목 없음');if(!isHex(t.color))delete t.color});
  if(Array.isArray(o.series))o.series.forEach(function(s){
    if(!s||typeof s!=='object'||!s.id||!REPEAT[s.mode]||!isDate(s.start)||!isDate(s.through))return;
    var days=(Array.isArray(s.days)?s.days:[]).map(Number).filter(function(n){return n>=0&&n<=6&&n%1===0});
    if(s.mode==='weekly'&&!days.length)return;
    var tp=s.tpl&&typeof s.tpl==='object'?s.tpl:{};
    b.series.push({id:String(s.id),mode:s.mode,days:days,start:s.start,until:isDate(s.until)?s.until:'',through:s.through,
      tpl:{title:String(tp.title||'제목 없음'),cat:CAT[tp.cat]?tp.cat:'prod',time:/^\d{2}:\d{2}$/.test(tp.time||'')?tp.time:'',timeEnd:/^\d{2}:\d{2}$/.test(tp.timeEnd||'')?tp.timeEnd:'',note:String(tp.note||''),color:isHex(tp.color)?tp.color:''}});
  });

/* ---------- 반복 일정 ---------- */
var REPEAT={daily:'매일',weekdays:'평일',weekly:'매주'};
var WD_ORDER=[1,2,3,4,5,6,0]; /* 월요일부터: 달력과 같은 순서 (값은 Date.getDay 기준) */
function repeatDate(s){return isDate(s)&&ymd(pd(s))===s}
function repeatDates(from,to,mode,days){
  var dates=[];
  for(var d=from;d<=to;d=addD(d,1)){
    var day=pd(d).getDay();
    if(mode==='daily'||(mode==='weekdays'&&day!==0&&day!==6)||(mode==='weekly'&&days.indexOf(day)>=0))dates.push(d);
  }
  return dates;
}
function repeatOptions(){
  var mode=$('#f-repeat'),box=$('#repeat-options');
  if(!mode||!box)return;
  box.hidden=!mode.value;
  var dv=$('#repeat-days');if(dv)dv.hidden=mode.value!=='weekly';
  var fv=$('#f-forever'),un=$('#f-repeat-until');if(fv&&un)un.disabled=fv.checked;
}
function repeatLabel(t){
  if(!t.seriesId)return '';
  var s=find(S.series,t.seriesId),mode=s?s.mode:t.repeat;
  if(!REPEAT[mode])return '';
  if(mode==='weekly'&&s&&s.days.length)return '매주 '+WD_ORDER.filter(function(d){return s.days.indexOf(d)>=0}).map(function(d){return WD[d]}).join('·');
  return REPEAT[mode];
}
/* 종료일 없는 반복은 1년 치를 만들어 두고, 앱을 열 때 남은 기간이 줄었으면 이어서 채운다.
   (지운 날짜가 되살아나지 않도록 through 이후 날짜만 만든다) */
function topUpSeries(){
  var lim=addD(today(),365),trig=addD(today(),300),changed=false,n=S.series.length;
  S.series=S.series.filter(function(s){return S.tasks.some(function(t){return t.seriesId===s.id})});
  if(S.series.length!==n)changed=true;
  S.series.forEach(function(s){
    if(s.until||s.through>=trig)return;
    repeatDates(addD(s.through,1),lim,s.mode,s.days).forEach(function(date){
      var item={id:uid(),title:s.tpl.title,cat:s.tpl.cat,date:date,time:s.tpl.time,timeEnd:s.tpl.timeEnd,note:s.tpl.note,status:'todo',doneAt:'',seriesId:s.id,repeat:s.mode,repeatUntil:''};
      if(s.tpl.color)item.color=s.tpl.color;
      S.tasks.push(item);
    });
    s.through=lim;changed=true;
  });
  return changed;
}

var metro={on:false,context:null,interval:null,next:0,beat:0,nodes:[],lights:[],token:0};
function metroNumber(value,min,max,fallback){var n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):fallback}
function metroSettings(){return S.settings.metronome||{bpm:80,beats:4,accent:true}}
function metroPanel(){
  var m=metroSettings();
  return '<section class="panel metronome" aria-labelledby="metro-title"><div class="ph"><h2 id="metro-title">메트로놈</h2><span id="metro-status" role="status">'+(metro.on?'재생 중':'정지')+'</span></div>'+
    '<div class="metro-controls"><label class="f"><span>BPM</span><input id="metro-bpm" type="number" min="20" max="300" step="1" value="'+m.bpm+'" data-change="metro-bpm"></label>'+
    '<label class="f"><span>한 마디의 박 수</span><select id="metro-beats" data-change="metro-beats">'+Array.from({length:12},function(_,i){var n=i+1;return '<option value="'+n+'"'+(n===m.beats?' selected':'')+'>'+n+'박</option>'}).join('')+'</select></label>'+
    '<label class="metro-accent"><input id="metro-accent" type="checkbox" data-change="metro-accent"'+(m.accent?' checked':'')+'>첫 박 강조</label>'+
    '<button class="btn piano" id="metro-toggle" data-act="metro-toggle" aria-pressed="'+metro.on+'">'+(metro.on?'메트로놈 정지':'메트로놈 시작')+'</button></div>'+
    '<div class="metro-beats" id="metro-lights" aria-hidden="true">'+Array.from({length:m.beats},function(){return '<span class="metro-dot"></span>'}).join('')+'</div>'+
    '<p class="help">20–300 BPM · 스톱워치·포모도로와 함께 사용할 수 있습니다. 다른 화면으로 이동하거나 앱이 배경으로 가면 멈춥니다.</p></section>';
}
function metroUI(){
  var b=$('#metro-toggle'),s=$('#metro-status');
  if(b){b.textContent=metro.on?'메트로놈 정지':'메트로놈 시작';b.setAttribute('aria-pressed',String(metro.on))}
  if(s)s.textContent=metro.on?'재생 중':'정지';
  if(!metro.on)document.querySelectorAll('.metro-dot').forEach(function(d){d.classList.remove('on')});
}
function metroStop(){
  metro.token++;metro.on=false;clearInterval(metro.interval);metro.interval=null;
  metro.lights.forEach(clearTimeout);metro.lights=[];
  metro.nodes.forEach(function(o){try{o.stop();o.disconnect()}catch(e){}});metro.nodes=[];
  metroUI();
}
function metroSchedule(){
  if(!metro.on||!metro.context)return;
  var ctx=metro.context,m=metroSettings();
  if(ctx.state!=='running'){metroStop();return}
  if(metro.next<ctx.currentTime)metro.next=ctx.currentTime+.02;
  while(metro.next<ctx.currentTime+.1){
    var at=metro.next,beat=metro.beat,o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=m.accent&&beat===0?1600:1000;
    g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.18,at+.003);g.gain.exponentialRampToValueAtTime(.0001,at+.045);
    o.connect(g);g.connect(ctx.destination);metro.nodes.push(o);
    o.onended=function(){this.disconnect();this._gain.disconnect();var i=metro.nodes.indexOf(this);if(i>=0)metro.nodes.splice(i,1)};
    o._gain=g;o.start(at);o.stop(at+.05);
    (function(index,time){var id=setTimeout(function(){var i=metro.lights.indexOf(id);if(i>=0)metro.lights.splice(i,1);if(!metro.on)return;
      document.querySelectorAll('.metro-dot').forEach(function(d,j){d.classList.toggle('on',j===index)});
    },Math.max(0,(time-ctx.currentTime)*1000));metro.lights.push(id)})(beat,at);
    metro.beat=(beat+1)%m.beats;metro.next+=60/m.bpm;
  }
}
async function metroStart(){
  var token=++metro.token;
  try{
    var Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)throw new Error('unsupported');
    if(!metro.context||metro.context.state==='closed')metro.context=new Audio();
    await metro.context.resume();
    if(token!==metro.token||document.hidden||ui.view!=='piano')return;
    if(metro.context.state!=='running')throw new Error('suspended');
    metro.on=true;metro.beat=0;metro.next=metro.context.currentTime+.03;
    metroSchedule();metro.interval=setInterval(metroSchedule,25);metroUI();
  }catch(e){if(token===metro.token){metroStop();toast('소리를 재생할 수 없습니다. 브라우저 소리 권한을 확인하고 다시 눌러 주세요.')}}
}
function metroChange(el,field){
  var m=Object.assign({},metroSettings()),value=el.value;
  if(field!=='accent'&&(!value.trim()||!Number.isFinite(Number(value)))){el.value=m[field];toast('숫자를 입력하세요.');return}
  m[field]=field==='accent'?el.checked:metroNumber(value,field==='bpm'?20:1,field==='bpm'?300:12,m[field]);
  var running=metro.on;metroStop();S.settings.metronome=m;save();render();
  var input=$('#metro-'+field);if(input)input.focus();

var audio=null;
function T(){
  if(!S.timer||typeof S.timer!=='object')S.timer={};
  var t=S.timer;
  if(t.mode!=='pomo')t.mode='sw';
  t.running=!!t.running;t.startedAt=+t.startedAt||0;t.acc=+t.acc||0;t.banked=+t.banked||0;t.round=+t.round||1;
  if(t.phase!=='rest')t.phase='focus';
  if(!find(S.pieces,t.pieceId))t.pieceId=S.pieces[0]?S.pieces[0].id:'';
  return t;
}
function tElapsed(){var t=T();return t.acc+(t.running?Date.now()-t.startedAt:0)}
function tLen(){var t=T();return (t.phase==='focus'?S.settings.focus:S.settings.rest)*60000}
function tPracticed(){var t=T();return t.mode==='sw'?tElapsed():t.banked+(t.phase==='focus'?tElapsed():0)}
function tAdvance(){
  var t=T(),ch=false,g=0;if(t.mode!=='pomo')return false;
  while(g++<200){var len=tLen(),el=tElapsed();if(el<len)break;
    if(t.phase==='focus'){t.banked+=len;t.phase='rest'}else{t.phase='focus';t.round++}
    t.acc=el-len;if(t.running)t.startedAt=Date.now();ch=true}
  return ch;
}
function resetTimer(){var t=T();t.running=false;t.acc=0;t.startedAt=0;t.banked=0;t.round=1;t.phase='focus'}
function beep(){
  try{if(!audio)return;var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.25,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.7);o.start();o.stop(audio.currentTime+.75)}catch(e){}
}
function tText(){

  var left=Math.ceil((tLen()-tElapsed())/1000)*1000;

}

function statData(){
  var td=today(),days=[],i;for(i=13;i>=0;i--)days.push(addD(td,-i));
  var prac=days.map(function(){return 0}),dp=days.map(function(){return 0}),dq=days.map(function(){return 0}),dj=days.map(function(){return 0}),de=days.map(function(){return 0});
  S.pieces.forEach(function(p){p.logs.forEach(function(l){var k=days.indexOf(l.date);if(k>=0)prac[k]+=(l.sec||0)/60})});
  S.tasks.forEach(function(t){if(t.status!=='done')return;var k=days.indexOf(t.doneAt||t.date);if(k>=0){({prod:dp,piano:dq,job:dj,etc:de}[t.cat]||dp)[k]++}});
  prac=prac.map(Math.round);
  return {days:days,prac:prac,dp:dp,dq:dq,dj:dj,de:de};
}

      '<div class="tile"><span class="k">평균 템포 달성률</span><span class="v">'+avg+'%</span><span class="s">연습곡 '+tp.length+'곡 기준</span></div>'+

function barChart(el,cfg){
  if(!el)return;
  var W=Math.max(260,el.clientWidth),H=190,m={t:20,r:6,b:22,l:30},n=cfg.days.length;
  var tot=cfg.days.map(function(_,i){return cfg.series.reduce(function(a,s){return a+s.vals[i]},0)});
  var mx=Math.max.apply(null,tot.concat([1])),steps=[1,2,5,10,15,30,60,120,240],st=steps[steps.length-1];
  for(var k=0;k<steps.length;k++){if(mx/steps[k]<=4){st=steps[k];break}}
  var top=Math.ceil(mx/st)*st,iw=W-m.l-m.r,ih=H-m.t-m.b,band=iw/n,bw=Math.min(22,band*.62),base=m.t+ih;
  var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(cfg.label)+'">';
  for(var v=0;v<=top;v+=st){var y=base-v/top*ih;h+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+(v?'#2a2833':'#4a4758')+'" stroke-width="1"/><text x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'}
  var every=Math.max(1,Math.ceil(n/Math.floor(iw/40))),imax=tot.indexOf(Math.max.apply(null,tot));
  for(var i=0;i<n;i++){
    var x=m.l+band*i+(band-bw)/2,yy=base;
    h+='<g class="col" data-i="'+i+'"><rect class="hit" x="'+(m.l+band*i)+'" y="'+m.t+'" width="'+band+'" height="'+ih+'" fill="transparent"/>';
    var live=cfg.series.filter(function(s){return s.vals[i]>0});
    live.forEach(function(s,j){
      var hh=s.vals[i]/top*ih,gap=j>0?2:0,y0=yy-hh,hv=Math.max(1,hh-gap),isTop=j===live.length-1,r=isTop?Math.min(4,hv,bw/2):0;
      h+='<path d="M'+x+','+(y0+hv)+'V'+(y0+r)+'Q'+x+','+y0+' '+(x+r)+','+y0+'H'+(x+bw-r)+'Q'+(x+bw)+','+y0+' '+(x+bw)+','+(y0+r)+'V'+(y0+hv)+'Z" fill="'+s.color+'"/>';
      yy=y0;
    });
    if(i===imax&&tot[i]>0)h+='<text class="val" x="'+(x+bw/2)+'" y="'+(yy-6)+'" text-anchor="middle">'+tot[i]+'</text>';
    if((n-1-i)%every===0)h+='<text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle"'+(i===n-1?' class="val"':'')+'>'+(i===n-1?'오늘':fmtShort(cfg.days[i]))+'</text>';
    h+='</g>';
  }
  el.innerHTML=h+'</svg><div class="tip"></div>';
  var tip=el.querySelector('.tip'),cols=el.querySelectorAll('.col');
  function show(g){
    var i=+g.dataset.i;cols.forEach(function(c){c.classList.toggle('on',c===g)});
    tip.innerHTML='<b>'+fmtDay(cfg.days[i])+'</b>'+cfg.series.map(function(s){return '<span><i class="sw '+(s.cls||'')+'"></i>'+esc(s.name)+' '+s.vals[i]+cfg.unit+'</span>'}).join('');
    tip.style.display='block';
    var cx=(m.l+band*i+band/2)/W*el.clientWidth,tw=tip.offsetWidth,left=Math.max(0,Math.min(el.clientWidth-tw,cx-tw/2));
    tip.style.left=left+'px';tip.style.top='-6px';
  }
  function hide(){tip.style.display='none';cols.forEach(function(c){c.classList.remove('on')})}
  cols.forEach(function(g){g.addEventListener('pointerenter',function(){show(g)});g.addEventListener('pointerdown',function(){show(g)})});
  el.addEventListener('pointerleave',hide);
}

function importText(txt){
  var o;try{o=JSON.parse(txt)}catch(e){return ferr('JSON 형식이 아닙니다. 내보낸 파일을 그대로 사용하세요.')}
  if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.projects)||!Array.isArray(o.pieces))return ferr('스튜디오 로그 백업 파일이 아닙니다. tasks, projects, pieces 항목이 필요합니다.');
  metroStop();closeSheet();
  withUndo('기록을 불러왔습니다.',function(){S=normalize(o);resetTimer()});
}
function exportFile(){

function docRef(){return firebase.firestore().collection('users').doc(sync.user.uid)}
function syncStart(u){
  sync.first=meta.uid!==u.uid;
  if(sync.first){meta={uid:u.uid,last:0,dirty:false,mod:0};saveMeta()}
  sync.unsub=docRef().onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites)return;
    var d=snap.exists?snap.data():null;
    if(sync.state==='error'){sync.state='on';sync.err=''}
    if(sync.choice){if(d)sync.choice=d;return}
    if(sync.first){
      sync.first=false;
      if(!d){if(meaningful())pushNow();else syncUI();return}
      if(meaningful()&&d.data!==cloudStr()){sync.choice=d;syncUI();askWhich();return}
      applyRemote(d,false);return;
    }
    onRemote(d);
  },function(e){sync.state='error';sync.err=syncErr(e);syncUI()});
}
function onRemote(d){
  if(!d||!d.updatedAt||d.updatedAt<=meta.last){
    if(meta.dirty&&cloudStr()!==sync.lastStr)pushNow();
    else{if(!sync.lastStr)sync.lastStr=cloudStr();syncUI()}
    return;
  }
  if(meta.dirty&&meta.mod>d.updatedAt){pushNow();return}
  if(!$('#sheet').hidden&&!$('#sync-sheet-mark')){sync.queued=d;return}
  applyRemote(d,true);
}
function applyRemote(d,notify){
  var o;try{o=JSON.parse(d.data)}catch(e){return}
  var timer=S.timer;metroStop();undoSnap=null;
  S=normalize(o);S.timer=timer;T();
  meta.last=d.updatedAt||Date.now();meta.dirty=false;saveMeta();
  sync.lastStr=cloudStr();sync.at=meta.last;sync.state='on';sync.err='';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(topUpSeries())save();
  render();syncUI();
  if(notify)toast('다른 기기에서 바뀐 기록을 불러왔습니다.');
}
function syncTouch(){
  if(!sync.user||sync.first||sync.choice)return;
  if(cloudStr()===sync.lastStr)return;
  meta.dirty=true;meta.mod=Date.now();saveMeta();
  sync.state='saving';syncUI();
  clearTimeout(sync.pushT);sync.pushT=setTimeout(pushNow,1200);
}
function pushNow(){
  if(!sync.user||sync.choice)return;
  clearTimeout(sync.pushT);
  var s=cloudStr(),ts=Date.now();
  meta.last=ts;meta.dirty=true;saveMeta();sync.lastStr=s;sync.state='saving';syncUI();
  docRef().set({data:s,updatedAt:ts}).then(function(){
    if(sync.lastStr===s){meta.dirty=false;saveMeta();sync.state='on';sync.err='';sync.at=ts;syncUI()}
  },function(e){sync.state='error';sync.err=syncErr(e);syncUI()});
}
